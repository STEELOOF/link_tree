<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name — Contact</title>
    <meta name="description" content="Your Name — all the ways to reach me.">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">

    <!-- Google Fonts (one request for both fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=DM+Serif+Display&display=swap"
        rel="stylesheet">

    <!-- Box Icons (pinned version so icons never change unexpectedly) -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <!-- Scripts -->
    <script src="scripts/cursor.js" defer></script>
    <script src="scripts/getYear.js" defer></script>
</head>

<body>

    <!-- Custom cursor (hidden on touch screens) -->
    <div class="cursor-dot" data-cursor-dot></div>
    <div class="cursor-ring" data-cursor-ring></div>

    <main>
        <!-- "--i" sets the order things fade in when the page loads -->

        <!-- Profile picture: replace images/pfp.svg with a real photo (e.g. pfp.jpg) -->
        <div class="pfp-wrap reveal" style="--i: 0">
            <img id="pfp" src="images/pfp.svg" alt="Profile picture of Your Name">
            <span class="badge">Say hi</span>
        </div>

        <h1 class="reveal" style="--i: 1">Your Name</h1>
        <div class="divider reveal" style="--i: 2"></div>
        <p class="reveal" style="--i: 3">A short line about you</p>

        <!-- Links: change the href and label of each button -->
        <nav id="btn-div">
            <a href="https://example.com" class="btn reveal" style="--i: 4">
                <i class="bx bx-link"></i>
                Website
            </a>

            <a href="https://github.com/username" class="btn reveal" style="--i: 5">
                <i class="bx bxl-github"></i>
                GitHub
            </a>

            <a href="https://www.linkedin.com/in/username" class="btn reveal" style="--i: 6">
                <i class="bx bxl-linkedin"></i>
                LinkedIn
            </a>

            <a href="https://www.instagram.com/username" class="btn reveal" style="--i: 7">
                <i class="bx bxl-instagram"></i>
                Instagram
            </a>

            <a href="mailto:name@example.com" class="btn reveal" style="--i: 8">
                <i class="bx bx-envelope"></i>
                Mail
            </a>
        </nav>
    </main>

    <footer>
        &copy;<span id="year"></span> - Your Name
    </footer>

</body>

</html>
